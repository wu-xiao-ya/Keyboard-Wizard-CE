name: Release CE

on:
  push:
    tags:
      - fabric-1.21.10-v*
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release bundle
        run: ./gradlew test build releaseBundle --no-daemon --stacktrace --warning-mode all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Keyboard Wizard CE Fabric 1.21.10 ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/*.jar
            build/release/*.zip
            build/release/SHA256SUMS.txt
          body: |
            v1.0.1 restores the adaptive UI layout, localized categories, binding and middle-click actions, safe list refresh, and the full help tooltip.
            See [CHANGELOG.md](https://github.com/wu-xiao-ya/Keyboard-Wizard-CE/blob/ce/fabric-1.21.10/CHANGELOG.md).
