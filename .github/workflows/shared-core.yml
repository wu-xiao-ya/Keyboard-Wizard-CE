name: Shared core and target builds

on:
  push:
    branches: [codex/shared-core]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Java 8 core
        working-directory: shared-core
        run: bash ./gradlew --no-daemon test

  targets:
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: forge-1.20.1
            java: '17'
            tasks: build releaseBundle
          - target: fabric-1.20
            java: '17'
            tasks: build releaseBundle
          - target: fabric-1.20.1
            java: '17'
            tasks: build releaseBundle
          - target: fabric-1.20.2
            java: '17'
            tasks: build releaseBundle
          - target: fabric-1.20.3
            java: '17'
            tasks: build releaseBundle
          - target: fabric-1.20.4
            java: '17'
            tasks: build releaseBundle
          - target: fabric-1.20.5
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.20.6
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.1
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.2
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.3
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.4
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.5
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.6
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.7
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.8
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.9
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.10
            java: '21'
            tasks: build releaseBundle
          - target: fabric-1.21.11
            java: '21'
            tasks: build releaseBundle
          - target: fabric-26.1
            java: '25'
            tasks: build releaseBundle
          - target: fabric-26.1.1
            java: '25'
            tasks: build releaseBundle
          - target: fabric-26.1.2
            java: '25'
            tasks: build releaseBundle
          - target: fabric-26.2
            java: '25'
            tasks: build releaseBundle
          - target: fabric-26.3
            java: '25'
            tasks: build releaseBundle
          - target: neoforge-1.21.1
            java: '21'
            tasks: assemble releaseBundle
          - target: neoforge-1.21.4
            java: '21'
            tasks: assemble releaseBundle
          - target: neoforge-26.1.2
            java: '25'
            tasks: assemble releaseBundle
          - target: neoforge-26.2
            java: '25'
            tasks: assemble releaseBundle
          - target: neoforge-26.3
            java: '25'
            tasks: assemble releaseBundle
          - target: forge-1.18.2
            java: '17'
            tasks: build releaseBundle
          - target: forge-1.16.5
            java: '17'
            tasks: build releaseBundle
          - target: forge-1.12.2
            java: '8'
            tasks: clean build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build target
        working-directory: targets/${{ matrix.target }}
        run: bash ./gradlew --no-daemon --stacktrace ${{ matrix.tasks }}
      - name: Verify binary and sources
        run: python3 tools/verify-target.py targets/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-wizard-ce-${{ matrix.target }}
          if-no-files-found: error
          path: |
            targets/${{ matrix.target }}/build/libs/*.jar
            targets/${{ matrix.target }}/build/release/*.zip
            targets/${{ matrix.target }}/build/release/SHA256SUMS.txt
